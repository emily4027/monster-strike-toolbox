<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪物彈珠工具箱</title>
    <!-- 載入 Noto Sans TC 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- 🎯 新增：Bootstrap Icons (用於登入/登出圖示) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 背景裝飾 -->
    <div class="bg-decoration"></div>

    <!-- 🎯 新增：Github 專案角落連結 -->
    <a href="https://github.com/emily4027/monster-strike-toolbox" target="_blank" class="github-link" title="前往 Github 專案原始碼">
        <i class="bi bi-github"></i>
    </a>

    <div class="container">
        <header class="main-header">
            <div class="logo-badge">TOOLBOX</div>
            <h1>怪物彈珠工具箱</h1>
            <p>Monster Strike Utilities</p>

            <!-- 🎯 Google 登入區塊 (置中於 Header 內) -->
            <div id="auth-container">
                <!-- 修正：加入 type="button" 避免意外提交 -->
                <button type="button" id="google-login-btn" class="auth-btn login" style="display: none;">
                    <i class="bi bi-google"></i> 登入
                </button>
                
                <!-- 🎯 重新設計的登入後資訊區塊 -->
                <!-- 用 button 讓鍵盤 (Tab + Enter) 也能操作登出 -->
                <button type="button" id="user-info" style="display: none;" title="點擊登出">
                    <img id="user-photo" alt="使用者頭像" hidden>
                    <i id="user-photo-fallback" class="bi bi-person-circle user-photo-fallback" aria-hidden="true"></i>
                    <span id="user-display-name"></span>
                    <i class="bi bi-chevron-down dropdown-arrow" aria-hidden="true"></i>
                </button>
            </div>
            
            <!-- 🎯 補回：隱私權提示 (預設隱藏，由 JS 控制顯示) -->
            <p id="privacy-note" class="privacy-note" style="display: none;">
                <i id="privacy-note-icon" class="bi bi-info-circle-fill"></i>
                <span id="privacy-note-text">登入僅用於雲端儲存您的工具資料，電子郵件不會公開。</span>
            </p>
            <!-- 🎯 結束 -->

        </header>

        <!-- 工具卡片由 script.js 依 tools.js 的清單產生，新增工具請改 tools.js -->
        <div class="card-grid" id="card-grid"></div>

        <!-- 工具卡片模板 -->
        <template id="tool-card-template">
            <a class="tool-card">
                <div class="card-decoration"></div>
                <div class="icon-wrapper">
                    <span class="emoji"></span>
                </div>
                <div class="card-content">
                    <h2></h2>
                    <p></p>
                    <div class="card-footer">
                        <span class="btn-go">前往使用</span>
                    </div>
                </div>
            </a>
        </template>

        <footer class="main-footer">
            <p>&copy; <span id="copyright-year">2025</span> Monster Strike Toolbox</p>
        </footer>
    </div>

    <!-- 🎯 引入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        // ⚠️⚠️⚠️ 您的真實 Firebase 配置 ⚠️⚠️⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyAjpfcNC4ZniqIxYzgYwp5Cs_8gbbmflVY",
            authDomain: "ms-toolbox-web.firebaseapp.com",
            projectId: "ms-toolbox-web",
            storageBucket: "ms-toolbox-web.firebasestorage.app",
            messagingSenderId: "777818785736",
            appId: "1:777818785736:web:880b878f4a510132dfe2fd",
            measurementId: "G-7KV0FSL1RG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        window.firebaseAuth = auth;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
    </script>

    <!-- 引入 JavaScript -->
    <script src="tools.js"></script>
    <script src="script.js"></script>
</body>

</html>
